# Cloudflare Workers config for the TaxFuse web SPA.
# Naming the Worker here lets the deploy confirm it should update the existing
# "taxfuse-web" Worker instead of stopping. This is a static-assets-only Worker
# (no server code): Wrangler serves the Vite build output in ./dist, with
# single-page-application fallback so client-side routes resolve to index.html.
name = "taxfuse-web"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
